<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Elton Sibara - Python developer building mobile apps, desktop apps and websites with Kivy, KivyMD, FastAPI and Django. Creator of Nestify."><meta property="og:title" content="Elton Sibara - Software developer"><meta property="og:description" content="Mobile apps, desktop apps and websites in Python. Creator of Nestify, the 3D house design app."><meta property="og:image" content="https://novasoftwaredev.netlify.app/og.jpg"><meta property="og:url" content="https://novasoftwaredev.netlify.app/"><meta property="og:type" content="website"><link rel="canonical" href="https://novasoftwaredev.netlify.app/"><link rel="icon" href="favicon.png"><title>Elton Sibara</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style id="css">
:root{--bg:#f5f6fb;--bg2:#eceef7;--card:#ffffff;--ink:#121528;--muted:#5b6078;--line:#dfe2ef;--a1:#6d4dff;--a2:#0bb5d6;--accent:#6d4dff;--on-accent:#fff;--orange:#e8731f;--star:#f5a623;--shadow:0 1px 2px rgba(18,21,40,.05),0 12px 36px rgba(18,21,40,.08);--glow:rgba(109,77,255,.12);--grad:linear-gradient(120deg,var(--a1),var(--a2))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0d1a;--bg2:#0f1324;--card:#141933;--ink:#eef0fb;--muted:#9ba2c2;--line:#232a4a;--a1:#8b6cff;--a2:#22d3ee;--accent:#8b6cff;--on-accent:#fff;--orange:#ff8a33;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 40px rgba(0,0,0,.4);--glow:rgba(139,108,255,.18)}}
:root[data-theme="dark"]{--bg:#0a0d1a;--bg2:#0f1324;--card:#141933;--ink:#eef0fb;--muted:#9ba2c2;--line:#232a4a;--a1:#8b6cff;--a2:#22d3ee;--accent:#8b6cff;--on-accent:#fff;--orange:#ff8a33;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 40px rgba(0,0,0,.4);--glow:rgba(139,108,255,.18)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
img,video{max-width:100%;display:block}
.wrap{position:relative;max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
h1,h2,h3{font-family:Sora,Inter,sans-serif;line-height:1.12;letter-spacing:-.02em;margin:0}
h2{font-size:clamp(28px,4vw,42px)}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.kicker{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.kicker:before{content:"";width:8px;height:8px;border-radius:2px;background:var(--grad);transform:rotate(45deg)}
section{padding:84px 0;position:relative}
.alt{background:var(--bg2)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:34px}
.sec-head p{margin:10px 0 0;color:var(--muted);max-width:580px}
.center{text-align:center;justify-content:center}
.center p{margin-left:auto;margin-right:auto}
/* header */
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font:700 18px Sora,sans-serif;text-decoration:none;white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--grad);color:#fff;display:grid;place-items:center;font:800 13px Sora,sans-serif}
.links{display:flex;gap:2px;margin-left:auto}
.links a{text-decoration:none;color:var(--muted);font-weight:500;font-size:15px;padding:8px 11px;border-radius:9px}
.links a:hover{color:var(--ink);background:var(--bg2)}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:11px;display:grid;place-items:center;cursor:pointer;flex:none}
.menu-btn{display:none}
@media (max-width:900px){.links{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left)) 16px}.links.open{display:flex}.menu-btn{display:grid;margin-left:auto}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px Inter,sans-serif;padding:12px 20px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 24px var(--glow)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.danger{color:#e04848}
.btn svg{width:18px;height:18px}
/* hero */
.hero{padding:72px 0 64px;overflow:hidden}
.hero:before{content:"";position:absolute;width:620px;height:620px;right:-160px;top:-180px;background:radial-gradient(circle,var(--glow),transparent 65%);pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.hello{font:600 18px Sora,sans-serif;color:var(--muted)}
.hero h1{font-size:clamp(42px,6.6vw,78px);font-weight:800;margin:6px 0 12px}
.role{font:600 clamp(18px,2.4vw,24px) Sora,sans-serif;min-height:1.4em}
.role .cur{display:inline-block;width:2px;height:1em;background:var(--accent);margin-left:3px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lead{font-size:clamp(16px,1.8vw,18px);color:var(--muted);margin:18px 0 28px;max-width:560px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.socials{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
.socials a{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink);text-decoration:none}
.socials a:hover{border-color:var(--accent);color:var(--accent)}
.socials svg{width:19px;height:19px}
.portrait{position:relative;justify-self:center;width:min(400px,100%)}
.portrait .ring{position:absolute;inset:-14px;border-radius:44% 56% 52% 48%/48% 44% 56% 52%;background:var(--grad);opacity:.9;animation:morph 12s ease-in-out infinite}
@keyframes morph{50%{border-radius:56% 44% 46% 54%/52% 58% 42% 48%}}
.portrait .ph{position:relative;aspect-ratio:5/6;border-radius:42% 58% 50% 50%/46% 42% 58% 54%;overflow:hidden;background:var(--bg2);border:6px solid var(--bg);animation:morph 12s ease-in-out infinite}
.portrait .ph img{width:100%;height:100%;object-fit:cover}
.portrait .ph .ini{width:100%;height:100%;display:grid;place-items:center;font:800 90px Sora;color:var(--muted)}
.float{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;white-space:nowrap}
.float b{font:800 24px Sora,sans-serif;display:block;line-height:1}
.float span{font-size:12.5px;color:var(--muted)}
.float.f1{left:-30px;bottom:56px}
.float.f2{right:-24px;top:40px}
.float .dot{width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.2)}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.portrait{order:-1;width:min(300px,78%)}.float.f1{left:-12px}.float.f2{right:-12px}}
/* hero photo as a background that fades into the page */
.hero-bg{position:absolute;top:0;right:0;bottom:0;width:min(52%,760px);pointer-events:none;z-index:0;
  -webkit-mask-image:linear-gradient(to right,transparent 0%,rgba(0,0,0,.45) 25%,#000 50%),linear-gradient(to top,transparent 0%,#000 30%);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0%,rgba(0,0,0,.45) 25%,#000 50%),linear-gradient(to top,transparent 0%,#000 30%);mask-composite:intersect}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:saturate(.92) contrast(1.04) brightness(.86)}
.hero-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 30%,transparent),transparent 28%),color-mix(in srgb,var(--bg) 14%,transparent)}
.hero.has-photo .wrap{z-index:1}
.hero.has-photo .portrait .ring,.hero.has-photo .portrait .ph{display:none}
.hero.has-photo .portrait{min-height:460px;width:100%}
.hero.has-photo .float.f1{left:auto;right:-2%;bottom:30px}
.hero.has-photo .float.f2{right:-2%;top:10px}
.hero.has-photo .lead{text-shadow:0 1px 18px var(--bg)}
@media (max-width:900px){
  .hero-bg{width:100%;bottom:auto;height:min(118vw,520px);
    -webkit-mask-image:linear-gradient(to top,transparent 0%,rgba(0,0,0,.5) 22%,#000 55%);mask-image:linear-gradient(to top,transparent 0%,rgba(0,0,0,.5) 22%,#000 55%);-webkit-mask-composite:source-over;mask-composite:add}
  .hero.has-photo{padding-top:24px}
  .hero.has-photo .portrait{order:-1;min-height:min(78vw,340px)}
  .hero.has-photo .float.f1{right:auto;left:0;bottom:6px}
  .hero.has-photo .float.f2{right:0;top:8px}}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:56px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.stat b{font:800 clamp(28px,3.4vw,38px) Sora,sans-serif;display:block}
.stat span{color:var(--muted);font-size:14px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
/* about */
.about{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.about p{color:var(--muted);margin:0 0 14px}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:12px}
.skill{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;position:relative}
.skill i{flex:none;width:38px;height:38px;border-radius:10px;background:var(--glow);color:var(--accent);display:grid;place-items:center;font:700 13px "JetBrains Mono",monospace;font-style:normal}
.skill b{display:block;font-weight:600;line-height:1.3}
.skill span{font-size:13px;color:var(--muted)}
@media (max-width:860px){.about{grid-template-columns:1fr}}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;position:relative;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card .ic{width:54px;height:54px;border-radius:16px;background:var(--grad);color:#fff;display:grid;place-items:center;margin-bottom:18px}
.card .ic svg{width:26px;height:26px}
.card h3{font-size:21px;margin-bottom:8px}
.card p{color:var(--muted);margin:0 0 14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:500 12px "JetBrains Mono",monospace;padding:5px 9px;border-radius:999px;background:var(--bg2);border:1px solid var(--line)}
.ed{display:none;gap:6px;margin-top:12px;flex-wrap:wrap}
body.editing .ed{display:flex}
/* timeline */
.timeline{position:relative;padding-left:28px;max-width:820px}
.timeline:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--a1),var(--a2))}
.tl{position:relative;padding:0 0 30px}
.tl:before{content:"";position:absolute;left:-28px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
.tl .when{font:600 13px "JetBrains Mono",monospace;color:var(--accent)}
.tl h3{font-size:20px;margin:4px 0 2px}
.tl .place{color:var(--ink);font-weight:500;font-size:15px}
.tl p{color:var(--muted);margin:6px 0 0}
/* product */
.product{display:grid;grid-template-columns:1fr 1.1fr;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:22px}
.product .info{padding:clamp(22px,4vw,40px)}
.product .shot{background:#0b0f15;position:relative;min-height:300px}
.product .shot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ptitle{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.ptitle img{width:62px;height:62px;border-radius:15px}
.ptitle h3{font-size:30px}
.status{display:inline-block;font:600 12px "JetBrains Mono",monospace;background:var(--glow);color:var(--accent);padding:4px 10px;border-radius:999px;margin-top:4px}
.feat{list-style:none;padding:0;margin:18px 0 22px;display:grid;gap:9px}
.feat li{display:flex;gap:10px;align-items:flex-start}
.feat li:before{content:"";flex:none;width:8px;height:8px;margin-top:9px;border-radius:2px;background:var(--grad);transform:rotate(45deg)}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:18px;padding-top:16px;border-top:1px dashed var(--line)}
.price b{font:800 32px Sora,sans-serif}
.price span{color:var(--muted);font-size:14px}
.meta{font:12px "JetBrains Mono",monospace;color:var(--muted);margin-top:16px}
@media (max-width:860px){.product{grid-template-columns:1fr}.product .shot{min-height:220px;aspect-ratio:16/10}}
/* gallery */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:500 14px Inter,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;position:relative;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .media{aspect-ratio:16/10;background:var(--bg2);position:relative;overflow:hidden}
.tile .media img,.tile .media video{width:100%;height:100%;object-fit:cover}
.tile .cap{padding:12px 14px 14px}
.tile .cap b{display:block;font-weight:600}
.tile .cap span{font-size:14px;color:var(--muted)}
.play{position:absolute;inset:0;display:grid;place-items:center}
.play i{width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.play i:after{content:"";border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.linkart{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,var(--bg2),var(--glow));font:600 13px "JetBrains Mono",monospace;color:var(--muted)}
.del{position:absolute;top:8px;right:8px;z-index:2}
.empty{color:var(--muted);padding:24px;border:1px dashed var(--line);border-radius:14px;text-align:center}
/* news */
.news{display:grid;gap:18px}
.post{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:grid;grid-template-columns:minmax(0,280px) 1fr}
.post.noimg{grid-template-columns:1fr}
.post .pimg{background:var(--bg2);position:relative;min-height:200px}
.post .pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.post .pbody{padding:22px 24px}
.post .pmeta{display:flex;gap:10px;align-items:center;font:600 12.5px "JetBrains Mono",monospace;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.post .ptag{color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.post h3{font-size:22px;margin-bottom:8px}
.post p{margin:0 0 10px;color:var(--muted)}
.share{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.share .lbl{font-size:13px;color:var(--muted);margin-right:4px}
.share a,.share button.s{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;color:var(--ink);cursor:pointer;text-decoration:none}
.share a:hover,.share button.s:hover{border-color:var(--accent);color:var(--accent)}
.share svg{width:17px;height:17px}
.share .grow{flex:1}
.comments{margin-top:14px;display:grid;gap:10px}
.cmt{background:var(--bg2);border-radius:12px;padding:10px 14px;font-size:14.5px}
.cmt b{font-weight:600}
.cmt .d{color:var(--muted);font-size:12px;margin-left:6px}
.cmt p{margin:4px 0 0;color:var(--ink)}
@media (max-width:700px){.post{grid-template-columns:1fr}.post .pimg{aspect-ratio:16/9}}
/* reviews */
.rv-top{display:flex;gap:22px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 26px;margin-bottom:18px}
.rv-top .avg{font:800 46px Sora,sans-serif;line-height:1}
.stars{color:var(--star);letter-spacing:2px;font-size:18px}
.stars .off{color:var(--line)}
.rv{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.rv p{margin:10px 0 12px;color:var(--ink)}
.rv .who{display:flex;gap:10px;align-items:center}
.rv .av{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font:700 14px Sora}
.rv .who span{display:block;font-size:13px;color:var(--muted)}
.starpick{display:flex;gap:4px}
.starpick button{font-size:30px;line-height:1;border:0;background:none;color:var(--line);cursor:pointer;padding:0 2px}
.starpick button.on{color:var(--star)}
/* docs */
.docs{display:grid;grid-template-columns:270px 1fr;gap:28px;align-items:start}
.toc{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.toc input{width:100%;font:15px Inter,sans-serif;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:8px}
.toc a{display:block;text-decoration:none;color:var(--muted);font-size:14px;padding:6px 10px;border-radius:8px}
.toc a:hover,.toc a.on{background:var(--bg2);color:var(--ink)}
.toc a.on{box-shadow:inset 3px 0 var(--accent)}
.doc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,36px);min-width:0}
.doc h3{font-size:25px;margin:0 0 10px}
.doc .dsec{padding-bottom:28px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.doc .dsec:last-child{border:0;margin:0;padding:0}
.doc p,.doc li{color:var(--muted)}
.doc strong{color:var(--ink)}
.doc code{font:13px "JetBrains Mono",monospace;background:var(--bg2);padding:2px 5px;border-radius:5px;color:var(--ink)}
.doc pre{overflow:auto;background:var(--bg2);padding:12px;border-radius:10px}
.doc table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
.doc th,.doc td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.doc-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.doc-top .meta{margin:4px 0 0}
.toc-select{display:none}
@media (max-width:860px){.docs{grid-template-columns:1fr}.toc{position:static;max-height:none}.toc .tlist{display:none}.toc-select{display:block;width:100%;font:15px Inter,sans-serif;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}}
/* contact */
.contact{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;background:var(--grad);color:#fff;border-radius:28px;padding:clamp(26px,5vw,56px);position:relative;overflow:hidden}
.contact h2{color:#fff}
.contact p{color:rgba(255,255,255,.85);margin:10px 0 0}
.contact .box{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:18px;padding:18px}
.contact .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.contact code{font:600 clamp(14px,2.2vw,17px) "JetBrains Mono",monospace;background:rgba(0,0,0,.18);padding:10px 12px;border-radius:10px;user-select:all;word-break:break-all;flex:1;min-width:0}
.contact .btn{background:#fff;color:#1a1640;border-color:#fff}
.contact .socials a{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
@media (max-width:760px){.contact{grid-template-columns:1fr}}
footer{padding:36px 0 60px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* overlay / dialogs */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,8,16,.82);display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left))}
.overlay.open{display:flex}
.lb{max-width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px;color:#eef1f5}
.lb img,.lb video{max-height:78vh;width:auto;margin:0 auto;border-radius:12px}
.lb .x{position:fixed;top:14px;right:14px;background:rgba(255,255,255,.12);color:#fff;border:0}
.panel{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(540px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.panel h3{font-size:22px;margin-bottom:6px}
.panel .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea,.field select{font:15px Inter,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.field textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px;align-items:center}
.hint{font-size:13px;color:var(--muted)}
.okmsg{background:var(--glow);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:14px}
/* edit bar */
.editbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));z-index:40;display:none;gap:8px;align-items:center;background:#121528;color:#eef0fb;padding:8px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.35);max-width:calc(100vw - 32px);flex-wrap:wrap;justify-content:center}
.editbar.show{display:flex}
.editbar .btn{background:transparent;color:#eef0fb;border-color:rgba(255,255,255,.25)}
.editbar .btn.primary{background:var(--grad);border-color:transparent}
.editbar .note{font-size:13px;padding:0 8px;opacity:.8}
.edit-only{display:none!important}
body.editing .edit-only{display:inline-flex!important}
.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:#121528;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;display:none;max-width:calc(100vw - 32px)}
@media print{header.top,.editbar,.share,.toc,.btn,.socials{display:none!important}}
</style>

2th40E1O5FpkZtLIkuBmm8jLr6TsLh//Z"}, {"id": "n3", "date": "2026-10-01", "tag": "Site", "title": "Welcome to my website", "body": "This is where I'll share my work, news and the documentation for my software. Thanks for visiting.", "comments": [], "fb": "", "image": ""}], "reviews": [], "docs": [{"name": "Nestify", "version": "1.0.0", "generated": "2026-10-16", "pdf": "Nestify_User_Guide.pdf", "sections": [{"id": "start-a-new-house", "title": "Start a new house", "html": "<p>The first time Nestify opens, a short welcome shows the four steps (get a plan, shape it, check it, hand\nit over). Open it again from Help (?) → Welcome tour.<\/p>\n<p>Press <strong>New house<\/strong> (the house-plus icon, top left):<\/p>\n<ul>\n<li><strong>Describe it<\/strong> in your own words, for example \"3 bedrooms, 2 bathrooms with en-suite, open plan,\n  double garage and a study, about 180 m2\" or \"double storey, 4 bedrooms, laundry\". The line underneath\n  shows what Nestify understood as you type. Press <strong>Build it<\/strong> and you get a full house: walls,\n  passage, doors, windows sized for daylight, room names, a garage with driveway and car, stairs for two\n  storeys, and furniture, lights, sockets and plumbing in every room. Every generated plan passes the\n  building rules check.<\/li>\n<li><strong>Starter plans<\/strong>: Starter home, Family home, Large family home, Double storey.<\/li>\n<li><strong>Blank page<\/strong> to draw your own with the wall, rectangle and line tools.<\/li>\n<\/ul>\n<p>Everything it makes is ordinary walls and objects, so you edit it like any other plan.<\/p>"}, {"id": "import-a-plan", "title": "Import a plan", "html": "<p>Press the plan icon (top left), or drop a file on the window. Pictures (JPG, PNG, BMP, TIFF, WebP) and PDFs\n(every page; use the arrows to pick the one with the floor plan) are accepted.<\/p>\n<ol>\n<li><strong>Sheet<\/strong> – in a photo the paper is found and flattened automatically (perspective removed, standard\n   paper shape kept), then squared up. If the guess is off, go to step 1 and drag the 4 cyan corners.\n   A scan or PDF page is used as it is.<\/li>\n<li><strong>Walls<\/strong> – every wall is found: solid, hatched or hollow (drawn as two lines), straight or slanted.\n   The sheet frame, title block, dimension lines, text, furniture, stairs and door swings are ignored, and\n   the walls are joined at corners and T-junctions. Drag an end to fix it (ends that meet move together),\n   drag on empty paper to add a missing wall, tap a wall to delete or split it.<\/li>\n<li><strong>Size<\/strong> – tap one wall you know (the longest is best), type its real length and press Set\n   (or drag the ruler over any known length). Set the wall height; thickness is measured from the drawing.<\/li>\n<li><strong>Build 3D<\/strong> – gaps in walls become doors and windows drawn in solid walls become windows.<\/li>\n<\/ol>"}, {"id": "editing-walls-doors-and-windows", "title": "Editing walls, doors and windows", "html": "<table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>Key<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Select<\/td>\n<td>Space<\/td>\n<td>Click a wall, the floor or the roof. Drag a selected wall's <strong>grip<\/strong> to move that corner – walls joined there follow.<\/td>\n<\/tr>\n<tr>\n<td>Wall<\/td>\n<td>L<\/td>\n<td>Click corner after corner. Snaps to <strong>Endpoint<\/strong>, <strong>Midpoint<\/strong>, <strong>On wall<\/strong>, <strong>Intersection<\/strong>, the <strong>red / green axes<\/strong>, <strong>Parallel / Perpendicular<\/strong> and <strong>From point<\/strong>. Type a length + Enter for an exact wall. Ending on a wall splits it, so the joint stays editable.<\/td>\n<\/tr>\n<tr>\n<td>Move<\/td>\n<td>M<\/td>\n<td>Drag a wall; walls joined to it stretch (Ctrl pulls it free). Drag a door/window along its wall. Type a distance + Enter afterwards for an exact move.<\/td>\n<\/tr>\n<tr>\n<td>Rotate<\/td>\n<td>Q<\/td>\n<td>Drag to turn the selected wall (snaps to 15°).<\/td>\n<\/tr>\n<tr>\n<td>Push/Pull<\/td>\n<td>P<\/td>\n<td>Drag any face: the top changes height, a side changes thickness (walls) or width/depth (objects), a wall end changes length. The face lights up orange; the opposite face stays put (Ctrl: both sides). Type a size + Enter, or + / − for 5 cm steps.<\/td>\n<\/tr>\n<tr>\n<td>Split<\/td>\n<td>S<\/td>\n<td>Click a wall where it should become two.<\/td>\n<\/tr>\n<tr>\n<td>Opening<\/td>\n<td>D<\/td>\n<td>Drag along a wall, then pick a door, window, passage or separate wall.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Click the orange arrow strip on the Layers or Properties panel (or press <code>[<\/code> / <code>]<\/code>) to fold it away for a bigger 3D view; on a small window they fold away by themselves. T toggles top view, F frames the house, Delete removes, Esc cancels, Ctrl+Z / Ctrl+Y undo / redo,\nCtrl+S save, Ctrl+O open. The <strong>Measurements<\/strong> box (bottom right) accepts <code>3.5<\/code>, <code>3500mm<\/code>, <code>350cm<\/code>, <code>12ft<\/code>, <code>30in<\/code>.<\/p>\n<p>Keyboard resizing of the selection: Ctrl+←/→ thinner/thicker (narrower/wider), Ctrl+↑/↓ lower/higher,\nAlt+←/→ shorter/longer (shallower/deeper), Shift for 1 cm steps. A tips card in the 3D view (lightbulb\nbutton) always lists the keys for what is selected.<\/p>"}, {"id": "drawing-shapes", "title": "Drawing shapes", "html": "<ul>\n<li><strong>Rectangle (R)<\/strong> and <strong>Circle (C)<\/strong>: draw on the ground or on the top face of anything, then move the mouse\n  up and click to pull the shape into a solid (or type <code>3,2<\/code> / a radius, Enter, then a height, Enter). Draw on\n  top of a solid to stack another one. Solids are objects: Move, Rotate, Push/Pull, copy, delete.<\/li>\n<li><strong>Line (N)<\/strong>: click corner after corner for any outline, <strong>A<\/strong> makes the next side an arc (click its end,\n  move to bend it, click); close on the first corner or Enter, then pull it up into a solid.<\/li>\n<li><strong>Paint bucket (B)<\/strong>: choose a material or a colour, click walls, roof, floors, rooms or solids.<\/li>\n<li><strong>Groups<\/strong>: Ctrl+click to select several things, <strong>Ctrl+G<\/strong> groups them (move, turn, copy and delete\n  together), <strong>Ctrl+Shift+G<\/strong> ungroups.<\/li>\n<li><strong>Scenes<\/strong>: save the current view (camera, style, floor) and glide back to it.<\/li>\n<li><strong>Tags<\/strong>: show or hide whole kinds of things (Furniture, Electrical, Plumbing, Garden, Shapes...).<\/li>\n<\/ul>"}, {"id": "dots-push-pull-shape-anything", "title": "Dots push/pull (shape anything)", "html": "<p>The Dots tool (left rail, or <strong>U<\/strong>) shapes the solids you draw - like SketchUp's draw-on-a-face and Push/Pull.<\/p>\n<ol>\n<li>Pick the Dots tool. A card at the bottom of the 3D view asks how to join the dots: <strong>Straight lines<\/strong> or\n   <strong>Smooth curve<\/strong> (Nestify remembers your choice).<\/li>\n<li>Click a face of a shape (a box from Rectangle, a cylinder from Circle, a Line outline): that is dot 1.<\/li>\n<li>Click more dots around the outline you want. They snap to corners and edges. Backspace takes one back.<\/li>\n<li>Click the first dot again (or double-click, or Enter). The outline turns <strong>green<\/strong>: it is ready.<\/li>\n<li>Hold the <strong>right mouse button<\/strong> and drag: <strong>into<\/strong> the face pushes the outline in (a recess, a window bay,\n   a hole right through if you go far enough), <strong>out<\/strong> of the face pulls it out (a bump, a bay, a balcony\n   box). The shape changes as you drag; let go to keep it. Looking straight at a face, drag up to pull and\n   down to push. Or type a distance + Enter (negative pushes in).<\/li>\n<\/ol>\n<p>If your dots go round (nearly) the whole face, the whole face moves, like Push/Pull. Every new face can be\nshaped again, so a modern house can start as one big box: push in the bays, pull out the overhangs. Ctrl+Z\nundoes a step. Esc cancels.<\/p>"}, {"id": "shape-looks-solid-glass-frosted-glowing", "title": "Shape looks: solid, glass, frosted, glowing", "html": "<p>Select a shape you drew (Rectangle, Circle, Line, or one edited with Dots). Under <strong>Look<\/strong> on the right:\n<strong>Solid<\/strong>, <strong>Glass<\/strong> (clear, see-through), <strong>Frosted<\/strong> (milky, blurry glass that lets light through) or\n<strong>Glow<\/strong> (lit from inside; in the evening it lights the walls and ground around it, and in a photo render it is\na real light). <strong>Colour<\/strong> changes the tint of the glass or the colour of the glow. Material still offers brick,\nwood, tiles, your own pictures and the rest.<\/p>"}, {"id": "edit-group-build-one-thing-on-its-own", "title": "Edit group (build one thing on its own)", "html": "<p>Like opening a group in SketchUp: double-click a shape, a piece of furniture or a group, or select it and press\n<strong>Edit group<\/strong> on the right. The rest of the house turns into faint ghost lines and the camera moves in. Draw\nrectangles, circles and lines, push / pull them, or add Library items: everything you make joins the group, and\nonly the group's pieces can be clicked and dragged (even behind walls). <strong>Done<\/strong> (top left) or <strong>Esc<\/strong> brings the\nwhole house back, at the view you had before.<\/p>"}, {"id": "your-own-pictures-as-materials", "title": "Your own pictures as materials", "html": "<p>Any picture can be a material: floor tiles, marble, wood, brick, stone, wallpaper, a logo. <strong>Material &gt; Your own\npicture<\/strong> on a room floor, a wall, the roof or a shape you drew: choose the picture and say how big one\npicture is in real life (0.6 m for a 600 mm tile). Nestify makes it repeat without seams; it shows in the Real\nstyle and in photo-real pictures. A house keeps up to 9 pictures, and they can be reused anywhere.<\/p>\n<p>Shapes can also be made of <strong>glass<\/strong> (Material &gt; Glass) - for your own windows, glass boxes and balustrades.<\/p>"}, {"id": "floors-stairs-and-rooms", "title": "Floors, stairs and rooms", "html": "<p>The bar at the top left of the 3D view lists the floors. <strong>+ Floor<\/strong> adds a storey on top (empty, with the\noutside walls copied, or a full copy). Click a floor to edit it; the floors above it are hidden so you can\nwork. <strong>All floors<\/strong> shows the whole house, the roof always sits on the top floor, and <strong>⋮<\/strong> renames or deletes\na floor. Put <strong>Stairs<\/strong> (Library → Furniture) on a floor and the floor above gets a hole over them; when\nwalking you climb them, or press <strong>PageUp / PageDown<\/strong> to change floor.<\/p>\n<p>Rooms are found automatically from the walls (a doorway counts as closed). Each room shows its name and\narea in the view (the <strong>Rooms<\/strong> chip turns the labels off) and in the Layers list, with the total area at the\ntop. Click inside a room to rename it and give it its own floor material and colour; names stay with the\nroom when you move walls.<\/p>"}, {"id": "walk-through-the-house", "title": "Walk through the house", "html": "<p>Press the walking-person button (or <strong>W<\/strong>). You start outside the front door at eye height (1.6 m) and walk\nin like a visitor: <strong>W/S<\/strong> or <strong>↑/↓<\/strong> walk, <strong>A/D<\/strong> step sideways, <strong>←/→<\/strong> or <strong>Q/E<\/strong> turn, drag to look\naround, <strong>Shift<\/strong> walks faster, the wheel takes a step, and clicking the floor walks you there. Walls,\nwindows and furniture stop you; doors swing open and passages let you through. A mini-map shows where you\nare (click it to go there) and a <strong>Rooms<\/strong> list jumps into each room (found automatically, with its area).\n<strong>Esc<\/strong> stops walking and puts the camera back where it was.<\/p>"}, {"id": "structure-parts-and-lifting-objects", "title": "Structure parts, and lifting objects", "html": "<p>The library has a <strong>Structure<\/strong> tab: round and square concrete columns, brick piers, steel H-columns, timber\npoles, concrete / steel / timber beams, lintels, roof trusses, purlins, strip footings, slabs, boundary walls,\npalisade fencing, a carport, a water tank, downpipes and solar panels. Resize any of them like other objects.<\/p>\n<p>To lift anything off the floor (a beam, a shelf, a solar panel onto the roof): <strong>Page Up / Page Down<\/strong>\n(Shift for 1 cm steps), the <strong>Up 10 cm / Down 10 cm<\/strong> buttons, or <strong>Shift + drag<\/strong> it up and down. Footings\nstart below the ground; the X-ray view shows them.<\/p>"}, {"id": "library-furniture-electronics-cars-trees-flowers", "title": "Library: furniture, electronics, cars, trees, flowers", "html": "<p>The sofa button opens the Library: 37 items (sofas, beds, dining set, wardrobe, kitchen, bathroom, TV,\nfridge, washing machine, stove, computer, air conditioner, cars, SUV, pickup, trees, pine, palm, bushes,\nflowers, hedge, fence, bench, pool). Click one, move the mouse to place it and click to drop it. Every\nobject can be dragged (Move), turned (Rotate), resized (Push/Pull or the numbers on the right), recoloured,\nrenamed, copied (Ctrl+D) and saved to <strong>My items<\/strong> with its name, size and colour. <strong>Import .obj model<\/strong> adds\nyour own 3D models. My items live in <code>~/.sketchit/library.json<\/code> and <code>~/.sketchit/models/<\/code>.<\/p>"}, {"id": "stairs-railings-site-electrical-and-plumbing", "title": "Stairs, railings, site, electrical and plumbing", "html": "<ul>\n<li><strong>Stairs<\/strong> (Library &gt; Building): straight, <strong>L-shaped<\/strong> and <strong>U-shaped<\/strong> with a landing and a sloping\n  handrail; the floor above gets a stairwell and the walker climbs them, landing included. Also a steel\n  balcony <strong>railing<\/strong> and a <strong>glass balustrade<\/strong>.<\/li>\n<li><strong>Sloping site<\/strong>: the mountain button opens the Site card (slope %, the direction it falls, the level\n  platform around the house). The ground is drawn sloping with shadows; <strong>driveway, brick paving, stone path,\n  gravel, instant lawn, timber deck and retaining wall<\/strong> (Library &gt; Garden) follow it, cars and trees stand\n  on it, and the walker walks on it. The estimate adds paving areas and the cut-and-fill to level the platform.<\/li>\n<li><strong>Electrical and plumbing points<\/strong> (Library &gt; Electrical / Plumbing): plug sockets, switches, TV/data\n  points, outside lights, distribution board and stove isolator snap to the nearest wall at the usual height\n  and face the room; ceiling lights and downlights hang from the ceiling; taps, garden taps, shower, geyser and\n  floor drains. They show as plan symbols (layers ELECTRICAL / PLUMBING in the DXF) and the estimate counts\n  each one plus wiring per electrical point and pipework per wet point.<\/li>\n<li><strong>Sun study<\/strong>: the Sun card films shadows from sunrise to sunset (a frame every 20 minutes, time stamped)\n  as an animated GIF, or MP4 when <code>imageio[ffmpeg]<\/code> is installed.<\/li>\n<\/ul>"}, {"id": "ground", "title": "Ground", "html": "<p>The Site card (the hills icon on the left) has a Ground button: grass, dusty soil, gravel and stones,\nconcrete, paving bricks, sand, tar, or <strong>your own picture<\/strong>. A photo of a lawn, a driveway or a farm is evened\nout and made seamless, so it repeats without joins; set how wide the area in the photo is. The ground shows\nin the 3D view, on a sloping plot and in photo-real pictures.<\/p>"}, {"id": "modern-glass-and-solar-panels", "title": "Modern glass and solar panels", "html": "<p>Windows: <strong>Glass wall<\/strong> (floor to ceiling), <strong>Slim frame<\/strong> and <strong>Clerestory strip<\/strong>; doors: <strong>Glass slider<\/strong> and\n<strong>Glass stacker<\/strong>. They have slim black aluminium frames split into tall panes, like modern houses. Change the\nframe colour of any wall's windows and doors (black, charcoal, bronze, silver, white) with <strong>Material &gt; Window\nand door frame colour<\/strong> - for one wall or every wall. With a <strong>flat<\/strong> roof and a deep overhang (Roof settings)\nand <strong>Natural stone cladding<\/strong> from the finishes catalogue you get the modern villa look.<\/p>\n<p><strong>Solar panels<\/strong> (Library &gt; Structure) lie on the roof: move one over the roof and it settles on the surface,\ntilted with the slope and facing down it. Ctrl+D copies it for the next panel.<\/p>"}, {"id": "real-look", "title": "Real look", "html": "<p>The default <strong>Real<\/strong> style paints plaster, brick, stone or timber walls; wood, tile or concrete floors; tiled,\nmetal or slate roofs; wooden doors and glass windows, under sky light on grass. Pick Material and Colour on\nthe right for a wall, the floor or the roof. Night, Sketch, Neon wire and Blueprint are still there.<\/p>"}, {"id": "pencil-and-glass-styles", "title": "Pencil and Glass styles", "html": "<p>Two more styles on the right: <strong>Pencil<\/strong> draws the house like a hand sketch - white paper, graphite edges and\nhatching on the shaded sides. <strong>Glass<\/strong> makes every face see-through with all its edges showing, so you can see\nhow pieces fit together while you build (it keeps depth, unlike X-ray).<\/p>"}, {"id": "roof-that-follows-the-plan", "title": "Roof that follows the plan", "html": "<p>The roof is built from the real footprint: an L, T or U house gets one wing per arm, the ridges run into\neach other and meet in valleys, and courtyards stay open. Hip, gable, shed, flat, gambrel and mansard all\nwork this way; slanted outlines get a true hip over the outline. Eaves overhang is measured from the outside\nface of the walls. While the Wall tool is active the roof steps aside so you can see the plan.<\/p>"}, {"id": "sun-and-shadows", "title": "Sun and shadows", "html": "<p>The sun button on the left opens the Sun card: time of day, month, place (city list), and which way north\npoints on the plan. The house casts real shadows on the ground, on itself and from trees and cars, and the\nlight turns warm in the morning and evening. <strong>Shadows<\/strong> and <strong>Real sun<\/strong> can be switched off.<\/p>"}, {"id": "x-ray-engineering-view", "title": "X-ray (engineering view)", "html": "<p>The X-ray card in Styles turns the house into a see-through engineering model: glowing blue surfaces, every\nedge drawn (hidden ones too) and a mesh of lines across walls, floors and furniture. Click any wall, object\nor anything you built and it glows blue while everything else turns into grey ghost lines, so you can study\nthat one part inside the whole house. Click empty space to see everything in blue again.<\/p>"}, {"id": "photo-real-pictures", "title": "Photo-real pictures", "html": "<p>Press the camera-shutter icon (top right) or Export → Photo-real picture. Nestify hands the view you see to a\nphysically based path tracer (Mitsuba 3): a real sun and sky for your place, day and hour; light that bounces\naround the rooms and comes in through the windows; glass that reflects; plaster, face brick, stone, timber\nfloors, tiles and roof tiles as real materials. Choose:<\/p>\n<ul>\n<li><strong>Size<\/strong>: Small, HD (1280 × 720), Full HD, Square.<\/li>\n<li><strong>Quality<\/strong>: Quick (a draft in seconds), Good, Best (for printing).<\/li>\n<li><strong>Light<\/strong>: as the Sun card, Morning, Golden hour, Evening with the lights on, Night.<\/li>\n<\/ul>\n<p>Photos need a processor with AVX instructions (almost every Core i3/i5/i7 or Ryzen PC; not low-power\nCeleron, Pentium Silver or Atom chips). On those PCs the Photo button says so and offers Picture of this view.<\/p>\n<p>The picture sharpens pass by pass while you watch, is cleaned of grain, toned like a photo, and kept in\nPictures/Nestify as well as wherever you save it. Walk inside (W) for a photo of a room: from inside, the\nwindows are open to the sun and the sky.<\/p>\n<p><strong>Lamps<\/strong> (ceiling lights, downlights, floor lamps, outside wall lights) glow, and in the evening (or with\nLights on in the Sun card) they light their own rooms in the 3D view and are real lights in photos.\n<strong>Curtains<\/strong> (open, closed, and net curtains that let light through) are in the library under Furniture;\ngenerated houses get curtains on their windows. <strong>TVs<\/strong> (on a stand, on the wall, a computer screen) can show\na picture or play an animated GIF: select the TV and press \"Picture / GIF on the screen\". It plays in the 3D\nview and shows in photos.<\/p>"}, {"id": "building-rules-check", "title": "Building rules check", "html": "<p>The clipboard button in the top bar checks the house against SANS 10400 rules of thumb: habitable rooms at\nleast 6 m² and 2 m wide, ceilings 2.4 m (2.1 m for bathrooms and passages), windows about 10% of the floor for\ndaylight and 5% opening for fresh air, doors 750 mm, stair risers up to 200 mm and treads 250 mm, outside walls\n140 mm or more, stairs to every upper floor. Tap a finding to go to it. A first check, not an approval.<\/p>"}, {"id": "quantities-and-cost", "title": "Quantities and cost", "html": "<p>The calculator button in the top bar opens a bill of quantities worked out from the model: strip footings\n(600 x 230) and floor slabs in concrete, bricks (52 per m² per leaf, +5%), cement and sand for mortar and\nplaster, paint (2 coats), floor tiles / wood / screed per room, ceiling boards, roof tiles or sheets from the\nreal roof surface, roof timber, gutters, and every door and window. Each line is priced; labour and\ncontingency are added as percentages to get the total and a rate per m². <strong>Prices<\/strong> edits every rate\n(saved in <code>~/.sketchit/prices.json<\/code>). The currency follows the computer's country (Windows region\nsetting): rand in South Africa, naira in Nigeria, pounds in the UK and so on, with the built-in prices\nconverted at today's exchange rates as a starting point. Rates are fetched in the background from\nopen.er-api.com (free, no account) when the app starts, kept in <code>~/.sketchit/rates.json<\/code> and refreshed every\n12 hours; without internet the last rates are used (<strong>Update rates<\/strong> in Prices fetches them now); pick another currency at the top of Prices, either\nconverting the numbers or only changing the symbol; <strong>PDF<\/strong> and <strong>CSV / Excel<\/strong> save the estimate with a\nroom schedule. Rules of thumb for planning, not a quantity surveyor's bill.<\/p>"}, {"id": "tape-measure", "title": "Tape measure", "html": "<p><strong>E<\/strong> (or the tape button) measures between two clicked points, snapping like the Wall tool. Kept sizes\nshow in the 3D view and print on the 2D plan; Ctrl+Z removes the last, the floor menu clears them.<\/p>"}, {"id": "plans-council-pack-and-pictures", "title": "Plans, council pack and pictures", "html": "<p>Export (toolbar) offers:<\/p>\n<ul>\n<li><strong>2D plan PDF<\/strong>: one A3 page per floor at a standard scale (1:50, 1:100 ...), with walls, doors and their\n  swing, windows, stairs, furniture, room names and areas, dimension chains, scale bar, north arrow and a\n  title block. Sizes are in the unit chosen at the bottom right.<\/li>\n<li><strong>2D plan PNG<\/strong> of the floor you are on.<\/li>\n<li><strong>Elevations and sections<\/strong>: the plan PDF continues with the four elevations (named by the compass from\n  the north in the Sun card) and sections A-A and B-B drawn from the 3D model: clean lines, pale-blue glass,\n  timber doors, grey roof, cut walls / slabs / roof in solid black, level marks (FFL of every floor, wall\n  plate, ridge) and the overall height. The section lines are marked on every floor plan. \"Elevations and\n  sections only\" saves just those pages.<\/li>\n<li><strong>DXF<\/strong> for AutoCAD, LibreCAD, SketchUp and other CAD programs (layers WALLS, DOORS, WINDOWS, ROOMS,\n  DIMS, FURNITURE; floors side by side, millimetres).<\/li>\n<li><strong>Picture of this view<\/strong> at 2x or 3x the window size, without grips, labels or selection.<\/li>\n<li>The 3D model as OBJ or STL, as before (all floors and the roof).<\/li>\n<li><strong>Council submission pack<\/strong> (PDF): site plan (plot boundary, building lines, street, roof outline,\n  driveway, setback dimensions, coverage), every floor plan, elevations, sections, a 1:25 wall section\n  (footing, DPC, slab, wall plate, roof build-up), and schedules (rooms and areas, doors, windows, checks,\n  general notes). Every sheet carries the owner, erf and address from <strong>Project details<\/strong>, which the pack\n  asks for the first time.<\/li>\n<li><strong>Share as a web page<\/strong>: one .html file with the house in 3D inside it. Anyone can open it in a\n  browser, on a phone too, with no app or internet: turn it with a finger or the mouse, Top / Front views,\n  take the roof off, hide the upper floors, and see the room list.<\/li>\n<\/ul>"}, {"id": "section-view", "title": "Section view", "html": "<p>The <strong>Section<\/strong> chip above the 3D view cuts the house open like a builder's section drawing. <strong>Cut across<\/strong>\nslices it at a height (1.2 m above the floor to start) so you look down into the rooms; <strong>Front to back<\/strong> and\n<strong>Side to side<\/strong> slice it upright, cutting away the half nearest you. Drag the slider to move the cut, and\n<strong>Flip<\/strong> to look from the other side. Cut walls show solid red, the way sections are drawn. Pictures you save\nkeep the cut; <strong>Off<\/strong> (or the Section chip again) closes it.<\/p>"}, {"id": "kitchen-builder", "title": "Kitchen builder", "html": "<p>Select the wall the kitchen goes against and press <strong>Fit a kitchen on this wall<\/strong> (on the right). Pick what you\nwant: cupboards, a sink, a stove with an extractor hood and a fridge; without the fridge; with a tall pantry as\nwell; or base cupboards only. Nestify uses the longest free stretch of the wall (doors and low windows are kept\nclear, up to 5.4 m), sizes the cupboards to fill it exactly, and leaves wall cupboards out under windows. The\nkitchen is one group: drag it to move it all, or Ungroup to change single units. The pieces are also in the\n<strong>Kitchen<\/strong> section of the Library.<\/p>"}, {"id": "finishes-catalogue", "title": "Finishes catalogue", "html": "<p>Select a room floor, a wall or the roof and press <strong>Material<\/strong>: at the top is <strong>Choose a product<\/strong>, a list of\nreal finishes with their prices: floor tiles, porcelain, laminate, vinyl plank, solid wood, polished concrete,\ncarpet tiles; paint colours, face brick, stone and timber cladding; concrete and clay roof tiles, IBR,\ncorrugated and Klip-lok sheeting, slate. The 3D view takes the product's look, and <strong>Quantities and cost<\/strong>\nprices it on its own line (with waste). Prices follow your price list's currency. Add your own products in\n<code>~/.sketchit/materials.json<\/code>.<\/p>"}, {"id": "360-pictures-and-walkthrough-videos", "title": "360 pictures and walkthrough videos", "html": "<p><strong>Export &gt; 360 picture of a room<\/strong>: pick a room (or where you stand in walk mode) and Nestify saves a 360 photo\nfrom eye height. Post it on Facebook or open it on a phone and turn around in it.<\/p>\n<p><strong>Export &gt; Walkthrough video<\/strong> makes an MP4: a slow flight around the house, a glide through your saved\nScenes, then a look around every room with its name and size. Choose standard, HD or full HD.<\/p>"}, {"id": "export-the-3d-model", "title": "Export the 3D model", "html": "<p><strong>Export &gt; 3D model in colour<\/strong>: a <strong>.GLB<\/strong> (glTF) file opens in Blender, SketchUp (glTF extension), Windows\n3D Viewer and 3D web viewers; <strong>.OBJ<\/strong> comes with a <strong>.MTL<\/strong> colour file beside it. Both include the roof,\ndoors, windows and furniture, in metres. STL (for 3D printing) is still there.<\/p>"}, {"id": "updates", "title": "Updates", "html": "<p>Once a day Nestify checks the developer's website for a newer version and offers the download (Help &gt;\nUpdates checks now). Copies from the Microsoft Store are updated by the Store instead.<\/p>"}, {"id": "files", "title": "Files", "html": "<p>Save writes a <code>.json<\/code> project (atomically). Unsaved work is autosaved every 45 s and offered back after a\ncrash. Export writes the 2D plan (PDF, PNG, DXF), a picture of the view, or the 3D model as OBJ (SketchUp,\nBlender) or STL (3D printing), in millimetres. Floors, rooms and the sun are saved in the project; older\nprojects open as one floor.<\/p>"}, {"id": "working-with-big-files", "title": "Working with big files", "html": "<p>The Layers list is updated in place instead of rebuilt (it used to take ~0.4 s per click), the roof is not\nrebuilt on every mouse move while dragging, and big changes (roof type, new plan, scaling, settings) are built\nin the background behind a \"please wait\" card.<\/p>"}]}]}</script>

        localStorage.setItem('gh_publish',JSON.stringify(conf));closeOv();render();toast('Phone publishing is on for this device.')}

function readAs(file){return new Promise(function(ok,bad){var r=new FileReader();r.onload=function(){ok(r.result)};r.onerror=function(){bad(new Error('Could not read that file.'))};r.readAsDataURL(file)})}
async function localFile(file){
  /* editing on Netlify: pictures go inside the page itself, made smaller so the site stays quick */
  if(file.type==='application/pdf'){var gc=ghConf();
    if(gc){var dir=(gc.path||'index.html').split('/').slice(0,-1).join('/');await ghPut((dir?dir+'/':'')+file.name,new Uint8Array(await file.arrayBuffer()),'Upload '+file.name);return file.name}
    toast('Copy '+file.name+' into your website folder too, next to index.html.');return file.name}
  if(file.type.indexOf('video')===0){if(file.size>8*1024*1024)throw new Error('Videos over 8 MB make the site slow: put it on YouTube and add it as a link.');return await readAs(file)}
  var url=await readAs(file);
  if(file.type.indexOf('image')!==0||file.type==='image/svg+xml'||file.type==='image/gif'||file.size<250*1024)return url;
  var img=await new Promise(function(ok,bad){var i=new Image();i.onload=function(){ok(i)};i.onerror=function(){bad(new Error('Could not open that picture.'))};i.src=url});
  var k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.86);
}
async function uploadFile(file){
  if(api.local)return await localFile(file);
  if(!api.assets)throw new Error('Uploading is not available here.');
  if(file.size>20*1024*1024)throw new Error('That file is bigger than 20 MB. Put long videos on YouTube and add them as a link.');
  var r=await api.assets.upload(file);return r.url;
}

        else if(f.type==='lines')obj[f.key]=el.value.split('\n').map(function(s){return s.trim()}).filter(Boolean);
        else if(f.type==='list')obj[f.key]=el.value.split(',').map(function(s){return s.trim()}).filter(Boolean);
        else obj[f.key]=el.value.trim();}
      if(onNew)onNew();closeOv();changed()}catch(err){msg.textContent=err.message||String(err)}}},[h('h3',{text:title})]);

    if(f.type==='lines')el.value=(v||[]).join('\n');else if(f.type==='list')el.value=(v||[]).join(', ');else if(f.type!=='image'&&v!=null)el.value=v;

    var extra=null;

    form.appendChild(h('div',{class:'field'},[h('label',{text:f.label}),extra,el,f.hint?h('span',{class:'hint',text:f.hint}):null]));
  });
  form.appendChild(h('div',{class:'row'},[msg,h('button',{class:'btn',type:'button',onclick:closeOv,text:'Cancel'}),h('button',{class:'btn primary',type:'submit',text:'OK'})]));
  ov.appendChild(form);ov.classList.add('open');var first=form.querySelector('input:not([type=file]),textarea');if(first)first.focus();
}

async function save(){
  if(api.local&&ghConf()){                         /* phone publishing: save to GitHub, Netlify puts it live */
    try{toast('Publishing…');var gc=ghConf();
      await ghPut(gc.path||'index.html',new TextEncoder().encode(documentHtml()),'Update the site from the editor');
      try{sessionStorage.removeItem('draft')}catch(e){}dirty=false;render();
      toast('Published. Your site updates in about a minute.')}
    catch(e){toast(e.message||String(e))}
    return}
  if(api.local){                                   /* Netlify: the new page is downloaded, then uploaded in Deploys */
    var blob=new Blob([documentHtml()],{type:'text/html'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='index.html';document.body.appendChild(a);a.click();a.remove();

  catch(e){try{sessionStorage.setItem('draft',JSON.stringify(S))}catch(x){}var c=e&&e.code;toast(c==='conflict'?'Someone saved at the same time — reloading.':c==='not_writer'||c==='not_granted'?'You can’t change this site.':'Could not publish: '+(e.message||c))}
}
